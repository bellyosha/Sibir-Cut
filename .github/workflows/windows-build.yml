name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sibir-cut-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct GUI source
        shell: pwsh
        run: |
          $parts = 1..4 | ForEach-Object { Get-Content ("sibir_cut/app.py.part" + $_) -Raw }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "sibir_cut/app.py"),
            ($parts -join ""),
            [System.Text.UTF8Encoding]::new($false)
          )
          if (!(Test-Path "sibir_cut/app.py")) { throw "app.py reconstruction failed" }

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Generate Windows icon
        run: python build/make_icon.py

      - name: Validate source
        run: |
          python -m compileall -q sibir_cut
          python -m sibir_cut --self-test
          python -c "import sibir_cut.app; print('GUI import OK')"
          python -c "from sibir_cut.app import calibration_gui_self_test; calibration_gui_self_test(); print('Calibration GUI OK')"

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean build/SibirCut.spec

      - name: Test frozen EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SibirCut.exe")) { throw "SibirCut.exe was not created" }
          $p = Start-Process -FilePath (Resolve-Path "dist/SibirCut.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:TEMP "sibir-cut-selftest-error.txt"
            if (Test-Path $log) { Get-Content $log }
            throw "Frozen EXE self-test failed: exit $($p.ExitCode)"
          }
          $ui = Start-Process -FilePath (Resolve-Path "dist/SibirCut.exe") -ArgumentList "--ui-self-test" -Wait -PassThru
          if ($ui.ExitCode -ne 0) {
            $log = Join-Path $env:TEMP "sibir-cut-ui-selftest-error.txt"
            if (Test-Path $log) { Get-Content $log }
            throw "Frozen calibration GUI self-test failed: exit $($ui.ExitCode)"
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Remove-Item portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force portable,portable/docs | Out-Null
          Copy-Item dist/SibirCut.exe portable/
          Copy-Item docs/*.md portable/docs/
          Copy-Item README.md,LICENSE.txt,THIRD_PARTY_NOTICES.md portable/
          Compress-Archive portable/* dist/Sibir_Cut_Portable_Windows_x64.zip -Force

      - name: Test portable ZIP
        shell: pwsh
        run: |
          Remove-Item portable-test -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive dist/Sibir_Cut_Portable_Windows_x64.zip portable-test -Force
          $p = Start-Process -FilePath (Resolve-Path "portable-test/SibirCut.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Portable EXE self-test failed: exit $($p.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -notin @(0,1641,3010)) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "build\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist/Sibir_Cut_Setup_0.3.3_x64.exe")) { throw "Installer was not created" }

      - name: Test installer on clean directory
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "SibirCutInstalled"
          $setup = Resolve-Path "dist/Sibir_Cut_Setup_0.3.3_x64.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART",("/DIR=" + $installDir) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: exit $($p.ExitCode)" }
          $installedExe = Join-Path $installDir "SibirCut.exe"
          if (!(Test-Path $installedExe)) { throw "Installed EXE not found" }
          $p2 = Start-Process -FilePath $installedExe -ArgumentList "--self-test" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "Installed EXE self-test failed: exit $($p2.ExitCode)" }

      - name: Create source ZIP
        shell: pwsh
        run: |
          Remove-Item sibir_cut/app.py.part* -Force
          $items = @("sibir_cut","build","assets","docs","README.md","LICENSE.txt","THIRD_PARTY_NOTICES.md","requirements-windows.txt","pyproject.toml")
          Compress-Archive $items dist/Sibir_Cut_v0.3.3_SOURCE.zip -Force

      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          @(
            "SibirCut.exe",
            "Sibir_Cut_Portable_Windows_x64.zip",
            "Sibir_Cut_Setup_0.3.3_x64.exe",
            "Sibir_Cut_v0.3.3_SOURCE.zip"
          ) | ForEach-Object {
            $h = Get-FileHash ("dist/" + $_) -Algorithm SHA256
            "$($h.Hash.ToLower())  $_"
          } | Set-Content dist/SHA256SUMS-WINDOWS.txt

      - name: Free old Actions artifact storage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $ids = gh api "repos/$repo/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.expired == false) | .id'
          foreach ($id in $ids) {
            Write-Host "Deleting old Actions artifact $id"
            gh api --method DELETE "repos/$repo/actions/artifacts/$id"
          }

      - name: Reset public release history
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $keep = "v0.3.3"

          $releaseTags = gh api "repos/$repo/releases?per_page=100" --paginate --jq '.[].tag_name'
          foreach ($tag in $releaseTags) {
            if ($tag -and $tag -ne $keep) {
              Write-Host "Deleting old release $tag"
              gh release delete $tag --repo $repo --yes --cleanup-tag
            }
          }

          $refs = gh api "repos/$repo/git/matching-refs/tags" --paginate --jq '.[].ref'
          foreach ($ref in $refs) {
            $tag = $ref -replace '^refs/tags/',''
            if ($tag -and $tag -ne $keep) {
              Write-Host "Deleting old tag $tag"
              gh api --method DELETE "repos/$repo/git/refs/tags/$tag" 2>$null
            }
          }

      - name: Publish Sibir Cut 0.3.3 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.3"
          $repo = "${{ github.repository }}"
          $notes = @"
          # Sibir Cut 0.3.3

          Первая публичная версия Sibir Cut для Windows.

          **[Скачать установщик Sibir Cut 0.3.3 (.exe)](https://github.com/$repo/releases/download/v0.3.3/Sibir_Cut_Setup_0.3.3_x64.exe)**

          Sibir Cut превращает Bambu Lab A1 в 2D-станок для рисования и резки с внешним держателем ручки или поворотного ножа.

          Основные возможности:
          - импорт SVG, DXF, PNG, JPG, JPEG, BMP и WebP;
          - живое перемещение, вращение и масштабирование рисунка прямо на виртуальном столе;
          - режимы «Резка» и «Рисование»;
          - зеркальный режим «наизнанку»;
          - штриховка и заливка фигур;
          - компенсация поворотного ножа, Blade Offset и Overcut;
          - отдельная калибровка ножа и ручки;
          - пошаговая настройка безопасной Z, рабочей/контактной Z и Offset X/Y;
          - поиск и сохранение Bambu Lab A1 в локальной сети;
          - автоматическое подключение к сохранённому принтеру при запуске программы;
          - отправка готового G-code на A1 по LAN;
          - запуск переданного задания вручную с экрана принтера;
          - сохранение проектов и настроек;
          - проверка границ траектории и блокировка опасного экспорта;
          - анимация готовой траектории.

          > Sibir Cut находится в активной разработке. Возможны баги и зависания. Первые задания и новые настройки проверяйте на тестовом материале и не оставляйте принтер без присмотра.

          Файлы релиза:
          - **Sibir_Cut_Setup_0.3.3_x64.exe** — обычный установщик Windows;
          - **Sibir_Cut_Portable_Windows_x64.zip** — portable-версия;
          - **Sibir_Cut_v0.3.3_SOURCE.zip** — исходный код;
          - **SHA256SUMS-WINDOWS.txt** — контрольные суммы.
          "@

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $repo --yes
          }

          git tag -f $tag "${{ github.sha }}"
          git push origin "refs/tags/$tag" --force
          gh release create $tag --repo $repo --target "${{ github.sha }}" --title "Sibir Cut 0.3.3" --notes $notes
          gh release upload $tag --repo $repo dist/Sibir_Cut_Setup_0.3.3_x64.exe dist/Sibir_Cut_Portable_Windows_x64.zip dist/Sibir_Cut_v0.3.3_SOURCE.zip dist/SHA256SUMS-WINDOWS.txt --clobber

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sibir-Cut-Windows-v0.3.3
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/Sibir_Cut_Setup_0.3.3_x64.exe
            dist/Sibir_Cut_Portable_Windows_x64.zip
            dist/Sibir_Cut_v0.3.3_SOURCE.zip
            dist/SHA256SUMS-WINDOWS.txt
